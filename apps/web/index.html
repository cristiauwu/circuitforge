<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="CircuitForge — plataforma web para el diseño y la simulación de circuitos electrónicos."
    />
    <title>CircuitForge</title>

    <!--
      Inter y JetBrains Mono (DESIGN.md §2.2). Se cargan con preconnect para
      reducir la latencia del handshake TLS, y con display=swap para que el texto
      sea legible de inmediato en vez de invisible (evita FOIT y mejora el LCP).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
